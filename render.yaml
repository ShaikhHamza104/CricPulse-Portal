databases:
  - name: cricpulse-portal-db
    databaseName: cricpulse_portal
    user: cricpulse_admin
    plan: free

services:
  - type: web
    name: cricpulse-portal
    runtime: python
    buildCommand: uv sync && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # ALLOWED_HOSTS: Restrict to exact Render hostname and local loopbacks for production security.
      # To attach a custom domain (e.g., portal.cricpulse.com), append it to this comma-separated list.
      - key: ALLOWED_HOSTS
        value: "cricpulse-portal.onrender.com,localhost,127.0.0.1"
      - key: CRICPULSE_ENGINE_URL
        value: "https://cricpulse-engine.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cricpulse-portal-db
          property: connectionString
