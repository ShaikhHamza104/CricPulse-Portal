name: Portal Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (15-minute inactivity limit)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-portal:
    name: Ping Portal & Engine
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat Ping
        run: |
          echo "Pinging CricPulse Engine..."
          curl -s -o /dev/null -w "Engine: HTTP %{http_code} (%{time_total}s)\n" https://cricpulse-engine.onrender.com/health || true
          echo "Heartbeat completed."
